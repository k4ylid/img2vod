appId: com.framevod.app
productName: FrameVOD
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
electronFuses:
  # The embedded asar-integrity resource crashes Electron 44's network service
  # on file:// loads from app.asar (renderer never finishes loading).
  enableEmbeddedAsarIntegrityValidation: false
win:
  target: nsis
